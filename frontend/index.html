<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Space Debris Tracking Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #190333;
        color: #20dec6;
      }

      /* ================= HEADER ================= */

      .header {
        padding: 25px 40px;
        border-bottom: 3px solid #3e4455;
        background: #002f64;
      }

      .header h1 {
        margin: 0;
        font-size: 28px;
      }

      .header p {
        margin-top: 8px;
        color: #00b2c1;
      }

      /* ================= DASHBOARD ================= */

      .dashboard {
        padding: 30px 40px;
      }

      /* ================= CARDS ================= */

      .cards {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 15px;
        margin-bottom: 30px;
      }

      .card {
        background: #3f2766;
        border: 2px solid #a88cfb;
        border-radius: 12px;
        padding: 20px;
      }

      .card-title {
        font-size: 12px;
        color: #71b6ff;
        margin-bottom: 10px;
      }

      .card-value {
        font-size: 28px;
        font-weight: bold;
        color: #ca36f4;
      }

      /* ================= RISK CARDS ================= */

      .critical-card {
        border-color: #ff3b3b;
        background: #463131;
      }

      .critical-card .card-title {
        font-size: 12px;
        color: #e68876;
        margin-bottom: 10px;
      }

      .critical-card .card-value {
        color: #ff4d4d;
      }

      .high-card {
        border-color: #ff8c42;
        background: #42311a;
      }

      .high-card .card-title {
        font-size: 12px;
        color: #f27f2d;
        margin-bottom: 10px;
      }

      .high-card .card-value {
        color: #ff9b55;
      }

      .medium-card {
        border-color: #ffec5f;
        background: #565518;
      }

      .medium-card .card-title {
        font-size: 12px;
        color: #e4a81a;
        margin-bottom: 10px;
      }

      .medium-card .card-value {
        color: #ffd166;
      }

      .low-card {
        border-color: #62d6a7;
        background: #316e56;
      }

      .low-card .card-title {
        font-size: 12px;
        color: #4edda4;
        margin-bottom: 10px;
      }

      .low-card .card-value {
        color: #62d6a7;
      }

      /* ================= CONTROLS ================= */

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #dd8635;
        color: #092322;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
      }

      button:hover {
        background: #f1d09a;
      }

      button:disabled {
        background: #9a9a9a;
        color: #343434;
        cursor: not-allowed;
      }

      /* ================= STATUS ================= */

      .status {
        color: #f9a6f4;
        margin-bottom: 20px;
      }

      /* ================= TABLE ================= */

      .table-container {
        overflow-x: auto;
        background: #13c5b4;
        border: 2px solid #19233f;
        border-radius: 16px;
        color: #0a2427;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        padding: 15px;
        background: #234a38;
        color: #b4f39d;
        font-size: 18px;
      }

      td {
        padding: 15px;
        border-top: 1.5px solid rgb(2, 9, 30);
        font-size: 14px;
        font-weight: bolder;
      }

      tr:hover {
        background: #a7fbfa93;
      }

      .risk {
        font-weight: bold;
      }

      /* ================= RISK COLORS ================= */

      .risk-critical {
        color: #ff0000;
      }

      .risk-high {
        color: #e98c52;
      }

      .risk-medium {
        color: #f9f871;
      }

      .risk-low {
        color: #0a7213;
      }

      .risk-safe {
        color: #145386;
      }

      /* ================= EMPTY STATE ================= */

      .empty {
        text-align: center;
        padding: 30px;
        color: #555;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 1100px) {
        .cards {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 700px) {
        .dashboard {
          padding: 20px;
        }

        .header {
          padding: 20px;
        }

        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 450px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <div class="header">
      <h1>Space Debris Tracking Dashboard</h1>

      <p>Orbital conjunction monitoring and collision risk analysis</p>
    </div>

    <!-- ================= DASHBOARD ================= -->

    <div class="dashboard">
      <!-- ================= SUMMARY CARDS ================= -->

      <div class="cards">
        <div class="card">
          <div class="card-title">OBJECTS TRACKED</div>

          <div class="card-value" id="objects-count">-</div>
        </div>

        <div class="card">
          <div class="card-title">CONJUNCTIONS</div>

          <div class="card-value" id="conjunction-count">0</div>
        </div>

        <div class="card critical-card">
          <div class="card-title">CRITICAL</div>

          <div class="card-value" id="critical-count">0</div>
        </div>

        <div class="card high-card">
          <div class="card-title">HIGH</div>

          <div class="card-value" id="high-count">0</div>
        </div>

        <div class="card medium-card">
          <div class="card-title">MEDIUM</div>

          <div class="card-value" id="medium-count">0</div>
        </div>

        <div class="card low-card">
          <div class="card-title">LOW</div>

          <div class="card-value" id="low-count">0</div>
        </div>
      </div>

      <!-- ================= CONTROLS ================= -->

      <div class="controls">
        <button id="refresh-button" onclick="refreshAnalysis()">
          Refresh Analysis
        </button>
      </div>

      <!-- ================= STATUS ================= -->

      <div class="status" id="status">Waiting for data...</div>

      <!-- ================= TABLE ================= -->

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Object A</th>

              <th>Object B</th>

              <th>Distance</th>

              <th>Time Until</th>

              <th>Risk</th>
            </tr>
          </thead>

          <tbody id="conjunctions">
            <tr>
              <td colspan="6" class="empty">No conjunction data loaded.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
      async function refreshAnalysis() {
        const status = document.getElementById("status");

        const button = document.getElementById("refresh-button");

        status.textContent = "Running orbital conjunction analysis...";

        button.disabled = true;

        button.textContent = "Analyzing...";

        try {
          const response = await fetch("/refresh", {
            method: "POST",
          });

          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }

          const result = await response.json();

          console.log("Refresh result:", result);

          /*
           * Load newly generated results
           */

          await loadConjunctions();

          status.textContent = `Analysis complete — ${result.events_found} conjunctions found.`;
        } catch (error) {
          console.error(error);

          status.textContent = "Analysis failed. Showing previous results.";

          /*
           * Load cached results
           */

          await loadConjunctions();
        } finally {
          button.disabled = false;

          button.textContent = "Refresh Analysis";
        }
      }

      /* ==================================================
            LOAD CONJUNCTIONS
            ONLY READS CACHED RESULTS
        ================================================== */

      async function loadConjunctions() {
        try {
          const response = await fetch("/conjunctions");

          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }

          const result = await response.json();

          // Get the actual conjunction array
          const data = result.conjunctions;

          // Update objects tracked
          document.getElementById("objects-count").textContent =
            result.objects_tracked;

          // Update dashboard
          updateDashboard(data);

          document.getElementById("status").textContent =
            `${data.length} conjunctions found`;
        } catch (error) {
          console.error(error);

          document.getElementById("status").textContent =
            "Failed to load conjunction data.";
        }
      }

      /* ==================================================
            UPDATE DASHBOARD
        ================================================== */

      function updateDashboard(data) {
        const table = document.getElementById("conjunctions");

        table.innerHTML = "";

        /*
         * Conjunction count
         */

        document.getElementById("conjunction-count").textContent = data.length;

        /*
         * Risk counters
         */

        let critical = 0;

        let high = 0;

        let medium = 0;

        let low = 0;

        for (const event of data) {
          if (event.risk === "CRITICAL") {
            critical++;
          } else if (event.risk === "HIGH") {
            high++;
          } else if (event.risk === "MEDIUM") {
            medium++;
          } else if (event.risk === "LOW") {
            low++;
          }
        }

        /*
         * Update risk cards
         */

        document.getElementById("critical-count").textContent = critical;

        document.getElementById("high-count").textContent = high;

        document.getElementById("medium-count").textContent = medium;

        document.getElementById("low-count").textContent = low;

        /*
         * Empty state
         */

        if (data.length === 0) {
          table.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="empty"
                        >
                            No conjunctions found.
                        </td>

                    </tr>

                `;

          return;
        }

        /*
         * Create table rows
         */

        for (const event of data) {
          const row = document.createElement("tr");

          const riskClass = getRiskClass(event.risk);

          row.innerHTML = `

                    <td>
                        ${event.id}
                    </td>

                    <td>
                        ${event.object_a}
                    </td>

                    <td>
                        ${event.object_b}
                    </td>

                    <td>
                        ${event.distance_km} km
                    </td>

                    <td>
                        ${formatTime(event.time_until_seconds)}
                    </td>

                    <td class="risk ${riskClass}">
                        ${event.risk}
                    </td>

                `;

          table.appendChild(row);
        }
      }

      /* ==================================================
            FORMAT TIME
        ================================================== */

      function formatTime(seconds) {
        if (seconds < 0) {
          return "Passed";
        }

        const minutes = Math.floor(seconds / 60);

        const hours = Math.floor(minutes / 60);

        const days = Math.floor(hours / 24);

        const years = Math.floor(days / 365);

        const remainingDays = days % 365;

        const remainingHours = hours % 24;

        const remainingMinutes = minutes % 60;

        /*
         * Years
         */

        if (years > 0) {
          return `${years}y ${remainingDays}d`;
        }

        /*
         * Days
         */

        if (days > 0) {
          return `${days}d ${remainingHours}h`;
        }

        /*
         * Hours
         */

        if (hours > 0) {
          return `${hours}h ${remainingMinutes}m`;
        }

        /*
         * Minutes
         */

        return `${minutes}m`;
      }

      /* ==================================================
            RISK CSS CLASS
        ================================================== */

      function getRiskClass(risk) {
        switch (risk) {
          case "CRITICAL":
            return "risk-critical";

          case "HIGH":
            return "risk-high";

          case "MEDIUM":
            return "risk-medium";

          case "LOW":
            return "risk-low";

          case "SAFE":
            return "risk-safe";

          default:
            return "";
        }
      }

      /* ==================================================
            LOAD CACHED RESULTS ON PAGE OPEN
        ================================================== */

      loadConjunctions();
    </script>
  </body>
</html>
